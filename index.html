<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Premium Tech</title>
    <meta name="description" content="Discover premium tech products curated for your digital lifestyle.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">AURA</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="cart">🛒 (0)</div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Discover Premium Tech</h1>
            <p>Elevate your digital lifestyle with our curated collection.</p>
            <button class="cta-button">Shop Now</button>
        </section>

        <section class="products">
            <h2>Featured Products</h2>
            <div class="product-grid">
                <!-- Product Card 1 -->
                <div class="product-card">
                    <div class="product-image" style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);"></div>
                    <div class="product-info">
                        <h3>Aura SoundPods</h3>
                        <p class="price">$199.00</p>
                        <button class="add-to-cart">Add to Cart</button>
                    </div>
                </div>
                <!-- Product Card 2 -->
                <div class="product-card">
                    <div class="product-image" style="background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);"></div>
                    <div class="product-info">
                        <h3>Lumina SmartWatch</h3>
                        <p class="price">$299.00</p>
                        <button class="add-to-cart">Add to Cart</button>
                    </div>
                </div>
                <!-- Product Card 3 -->
                <div class="product-card">
                    <div class="product-image" style="background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);"></div>
                    <div class="product-info">
                        <h3>Nexus Tablet</h3>
                        <p class="price">$499.00</p>
                        <button class="add-to-cart">Add to Cart</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Aura Technologies. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
